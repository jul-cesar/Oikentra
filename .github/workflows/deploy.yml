name: Validate and Deploy Oikentra

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect affected workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base: ${{ steps.plan.outputs.base }}
      all: ${{ steps.plan.outputs.all }}
      affected: ${{ steps.plan.outputs.affected }}
      services: ${{ steps.plan.outputs.services }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Create deployment plan
        id: plan
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          base=""
          all=false

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$GITHUB_REF" == refs/tags/* ]]; then
            all=true
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BASE_SHA"
          fi

          if [[ "$all" == "false" && ( -z "$base" || "$base" =~ ^0+$ ) ]]; then
            all=true
          fi

          if [[ "$all" == "false" ]] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            all=true
          fi

          if [[ "$all" == "false" ]] && git diff --name-only "$base" HEAD | grep -Eq \
            '^(\.dockerignore$|package.json$|pnpm-lock.yaml$|pnpm-workspace.yaml$)'; then
            all=true
          fi

          catalog=$(jq -cn --arg owner "$owner" '[
            {
              name: "auth-service",
              package: "@oikentra/auth-service",
              image: ("ghcr.io/" + $owner + "/oikentra-auth-service"),
              dockerfile: "apps/auth-service/Dockerfile"
            },
            {
              name: "business-service",
              package: "@oikentra/business-service",
              image: ("ghcr.io/" + $owner + "/oikentra-business-service"),
              dockerfile: "apps/business-service/Dockerfile"
            },
            {
              name: "sync-service",
              package: "@oikentra/sync-service",
              image: ("ghcr.io/" + $owner + "/oikentra-sync-service"),
              dockerfile: "apps/sync-service/Dockerfile"
            },
            {
              name: "reports-service",
              package: "@oikentra/reports-service",
              image: ("ghcr.io/" + $owner + "/oikentra-reports-service"),
              dockerfile: "apps/reports-service/Dockerfile"
            },
            {
              name: "employees-service",
              package: "@oikentra/employees-service",
              image: ("ghcr.io/" + $owner + "/oikentra-employees-service"),
              dockerfile: "apps/employees-service/Dockerfile"
            },
            {
              name: "ai-service",
              package: "@oikentra/ai-service",
              image: ("ghcr.io/" + $owner + "/oikentra-ai-service"),
              dockerfile: "apps/ai-service/Dockerfile"
            },
            {
              name: "web",
              package: "@oikentra/web",
              image: ("ghcr.io/" + $owner + "/oikentra-web"),
              dockerfile: "apps/web/Dockerfile"
            }
          ]')

          if [[ "$all" == "true" ]]; then
            affected=true
            services="$catalog"
          else
            selected=$(pnpm --filter "...[$base]" --filter "!oikentra" list --depth -1 --json | jq -c '[.[].name]')
            affected=$(jq -r 'length > 0' <<< "$selected")
            services=$(jq -c --argjson selected "$selected" \
              '[.[] | select(.package as $package | $selected | index($package))]' \
              <<< "$catalog")
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "all=$all" >> "$GITHUB_OUTPUT"
          echo "affected=$affected" >> "$GITHUB_OUTPUT"
          echo "services=$services" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate affected workspaces
    needs: detect-changes
    if: needs.detect-changes.outputs.affected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install affected dependencies
        shell: bash
        env:
          BASE_SHA: ${{ needs.detect-changes.outputs.base }}
          VALIDATE_ALL: ${{ needs.detect-changes.outputs.all }}
        run: |
          if [[ "$VALIDATE_ALL" == "true" ]]; then
            pnpm install --frozen-lockfile
          else
            pnpm --filter "...[$BASE_SHA]..." --filter "!oikentra" install --frozen-lockfile
          fi

      - name: Typecheck, lint, and test affected workspaces
        shell: bash
        env:
          BASE_SHA: ${{ needs.detect-changes.outputs.base }}
          VALIDATE_ALL: ${{ needs.detect-changes.outputs.all }}
        run: |
          set -euo pipefail

          run_check() {
            if [[ "$VALIDATE_ALL" == "true" ]]; then
              pnpm --filter "./apps/**" --filter "./packages/**" --if-present run "$1"
            else
              pnpm --filter "...[$BASE_SHA]" --filter "!oikentra" --if-present run "$1"
            fi
          }

          run_check typecheck
          run_check lint
          run_check test

  deploy:
    name: Deploy ${{ matrix.service.name }}
    needs: [detect-changes, validate]
    if: >-
      github.event_name != 'pull_request' &&
      needs.detect-changes.outputs.services != '[]' &&
      needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        id: dokploy
        shell: bash
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          AUTH_APP_ID: ${{ secrets.DOKPLOY_AUTH_APPLICATION_ID }}
          BUSINESS_APP_ID: ${{ secrets.DOKPLOY_BUSINESS_APPLICATION_ID }}
          SYNC_APP_ID: ${{ secrets.DOKPLOY_SYNC_APPLICATION_ID }}
          REPORTS_APP_ID: ${{ secrets.DOKPLOY_REPORTS_APPLICATION_ID }}
          EMPLOYEES_APP_ID: ${{ secrets.DOKPLOY_EMPLOYEES_APPLICATION_ID }}
          AI_APP_ID: ${{ secrets.DOKPLOY_AI_APPLICATION_ID }}
          WEB_APP_ID: ${{ secrets.DOKPLOY_WEB_APPLICATION_ID }}
        run: |
          case "${{ matrix.service.name }}" in
            auth-service) application_id="$AUTH_APP_ID" ;;
            business-service) application_id="$BUSINESS_APP_ID" ;;
            sync-service) application_id="$SYNC_APP_ID" ;;
            reports-service) application_id="$REPORTS_APP_ID" ;;
            employees-service) application_id="$EMPLOYEES_APP_ID" ;;
            ai-service) application_id="$AI_APP_ID" ;;
            web) application_id="$WEB_APP_ID" ;;
            *) echo "Unknown service" >&2; exit 1 ;;
          esac

          if [[ -z "$DOKPLOY_URL" || -z "$DOKPLOY_API_KEY" || -z "$application_id" ]]; then
            echo "Dokploy is not fully configured for ${{ matrix.service.name }}" >&2
            exit 1
          fi

          echo "application_id=$application_id" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.service.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          build-args: |
            BUSINESS_BASE_URL=${{ vars.BUSINESS_BASE_URL }}
            REPORTS_BASE_URL=${{ vars.REPORTS_BASE_URL }}
            AUTH_BASE_URL=${{ vars.AUTH_BASE_URL }}
            NEXT_PUBLIC_AUTH_BASE_URL=${{ vars.NEXT_PUBLIC_AUTH_BASE_URL }}
            AI_BASE_URL=${{ vars.AI_BASE_URL }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          APPLICATION_ID: ${{ steps.dokploy.outputs.application_id }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 90 \
            --request POST "$DOKPLOY_URL/api/application.deploy" \
            --header "accept: application/json" \
            --header "x-api-key: $DOKPLOY_API_KEY" \
            --header "Content-Type: application/json" \
            --data "{\"applicationId\":\"$APPLICATION_ID\"}"
