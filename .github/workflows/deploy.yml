name: Validate and Deploy Oikentra

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.matrix.outputs.projects }}
      services: ${{ steps.matrix.outputs.services }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed projects
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            auth:
              - 'apps/auth-service/**'
            business:
              - 'apps/business-service/**'
            sync:
              - 'apps/sync-service/**'
            reports:
              - 'apps/reports-service/**'
            employees:
              - 'apps/employees-service/**'
            ai:
              - 'apps/ai-service/**'
            web:
              - 'apps/web/**'
            shared:
              - '.github/workflows/deploy.yml'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
            lockfile:
              - 'pnpm-lock.yaml'

      - name: Create job matrices
        id: matrix
        shell: bash
        env:
          AUTH_CHANGED: ${{ steps.filter.outputs.auth }}
          BUSINESS_CHANGED: ${{ steps.filter.outputs.business }}
          SYNC_CHANGED: ${{ steps.filter.outputs.sync }}
          REPORTS_CHANGED: ${{ steps.filter.outputs.reports }}
          EMPLOYEES_CHANGED: ${{ steps.filter.outputs.employees }}
          AI_CHANGED: ${{ steps.filter.outputs.ai }}
          WEB_CHANGED: ${{ steps.filter.outputs.web }}
          SHARED_CHANGED: ${{ steps.filter.outputs.shared }}
          LOCKFILE_CHANGED: ${{ steps.filter.outputs.lockfile }}
          GH_TOKEN: ${{ github.token }}
        run: |
          projects='[]'
          services='[]'
          deploy_all=false
          owner="${GITHUB_REPOSITORY_OWNER,,}"

          add_project() {
            local name="$1"
            local package="$2"
            projects=$(jq -c \
              --arg name "$name" \
              --arg package "$package" \
              '. + [{"name":$name,"package":$package}]' \
              <<< "$projects")
          }

          add_service() {
            local name="$1"
            local image="$2"
            local dockerfile="$3"
            services=$(jq -c \
              --arg name "$name" \
              --arg image "$image" \
              --arg dockerfile "$dockerfile" \
              '. + [{"name":$name,"image":$image,"dockerfile":$dockerfile}]' \
              <<< "$services")
          }

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" \
            || "${GITHUB_REF}" == refs/tags/* ]]; then
            deploy_all=true
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "push" \
            && "${GITHUB_REF}" == refs/heads/* ]]; then
            previous_conclusion=$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs" \
                -f branch="${GITHUB_REF_NAME}" \
                -f event="push" \
                -f status="completed" \
                -f per_page=5 \
                --jq ".workflow_runs[] \
                  | select(.id != ${GITHUB_RUN_ID}) \
                  | .conclusion" \
                2>/dev/null \
                | head -n 1 \
                || true
            )

            if [[ -n "$previous_conclusion" \
              && "$previous_conclusion" != "success" ]]; then
              deploy_all=true
            fi
          fi

          if [[ "$LOCKFILE_CHANGED" == "true" \
            && "$AUTH_CHANGED" != "true" \
            && "$BUSINESS_CHANGED" != "true" \
            && "$SYNC_CHANGED" != "true" \
            && "$REPORTS_CHANGED" != "true" \
            && "$EMPLOYEES_CHANGED" != "true" \
            && "$AI_CHANGED" != "true" \
            && "$WEB_CHANGED" != "true" \
            && "$SHARED_CHANGED" != "true" ]]; then
            deploy_all=true
          fi

          if [[ "$deploy_all" == "true" \
            || "$SHARED_CHANGED" == "true" \
            || "$AUTH_CHANGED" == "true" ]]; then
            add_project "auth-service" "@oikentra/auth-service"
            add_service \
              "auth-service" \
              "ghcr.io/$owner/oikentra-auth-service" \
              "apps/auth-service/Dockerfile"
          fi

          if [[ "$deploy_all" == "true" \
            || "$SHARED_CHANGED" == "true" \
            || "$BUSINESS_CHANGED" == "true" ]]; then
            add_project "business-service" "@oikentra/business-service"
            add_service \
              "business-service" \
              "ghcr.io/$owner/oikentra-business-service" \
              "apps/business-service/Dockerfile"
          fi

          if [[ "$deploy_all" == "true" \
            || "$SHARED_CHANGED" == "true" \
            || "$SYNC_CHANGED" == "true" ]]; then
            add_project "sync-service" "@oikentra/sync-service"
            add_service \
              "sync-service" \
              "ghcr.io/$owner/oikentra-sync-service" \
              "apps/sync-service/Dockerfile"
          fi

          if [[ "$deploy_all" == "true" \
            || "$SHARED_CHANGED" == "true" \
            || "$REPORTS_CHANGED" == "true" ]]; then
            add_project "reports-service" "@oikentra/reports-service"
            add_service \
              "reports-service" \
              "ghcr.io/$owner/oikentra-reports-service" \
              "apps/reports-service/Dockerfile"
          fi

          if [[ "$deploy_all" == "true" \
            || "$SHARED_CHANGED" == "true" \
            || "$EMPLOYEES_CHANGED" == "true" ]]; then
            add_project "employees-service" "@oikentra/employees-service"
            add_service \
              "employees-service" \
              "ghcr.io/$owner/oikentra-employees-service" \
              "apps/employees-service/Dockerfile"
          fi

          if [[ "$deploy_all" == "true" \
            || "$SHARED_CHANGED" == "true" \
            || "$AI_CHANGED" == "true" ]]; then
            add_project "ai-service" "@oikentra/ai-service"
            add_service \
              "ai-service" \
              "ghcr.io/$owner/oikentra-ai-service" \
              "apps/ai-service/Dockerfile"
          fi

          if [[ "$deploy_all" == "true" \
            || "$SHARED_CHANGED" == "true" \
            || "$WEB_CHANGED" == "true" ]]; then
            add_project "web" "@oikentra/web"
            add_service \
              "web" \
              "ghcr.io/$owner/oikentra-web" \
              "apps/web/Dockerfile"
          fi

          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "services=$services" >> "$GITHUB_OUTPUT"

  validate:
    needs: detect-changes
    if: needs.detect-changes.outputs.projects != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.detect-changes.outputs.projects) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter "${{ matrix.project.package }}" run typecheck

      - name: Lint
        run: pnpm --filter "${{ matrix.project.package }}" --if-present run lint

      - name: Test
        run: pnpm --filter "${{ matrix.project.package }}" --if-present run test

  deploy:
    needs: [detect-changes, validate]
    if: >-
      github.event_name != 'pull_request' &&
      needs.detect-changes.outputs.services != '[]' &&
      needs.validate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.service.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          build-args: |
            BUSINESS_BASE_URL=${{ vars.BUSINESS_BASE_URL }}
            REPORTS_BASE_URL=${{ vars.REPORTS_BASE_URL }}
            AUTH_BASE_URL=${{ vars.AUTH_BASE_URL }}
            NEXT_PUBLIC_AUTH_BASE_URL=${{ vars.NEXT_PUBLIC_AUTH_BASE_URL }}
            AI_BASE_URL=${{ vars.AI_BASE_URL }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      - name: Resolve Dokploy application id
        id: dokploy
        shell: bash
        env:
          AUTH_APP_ID: ${{ secrets.DOKPLOY_AUTH_APPLICATION_ID }}
          BUSINESS_APP_ID: ${{ secrets.DOKPLOY_BUSINESS_APPLICATION_ID }}
          SYNC_APP_ID: ${{ secrets.DOKPLOY_SYNC_APPLICATION_ID }}
          REPORTS_APP_ID: ${{ secrets.DOKPLOY_REPORTS_APPLICATION_ID }}
          EMPLOYEES_APP_ID: ${{ secrets.DOKPLOY_EMPLOYEES_APPLICATION_ID }}
          AI_APP_ID: ${{ secrets.DOKPLOY_AI_APPLICATION_ID }}
          WEB_APP_ID: ${{ secrets.DOKPLOY_WEB_APPLICATION_ID }}
        run: |
          case "${{ matrix.service.name }}" in
            auth-service) application_id="$AUTH_APP_ID" ;;
            business-service) application_id="$BUSINESS_APP_ID" ;;
            sync-service) application_id="$SYNC_APP_ID" ;;
            reports-service) application_id="$REPORTS_APP_ID" ;;
            employees-service) application_id="$EMPLOYEES_APP_ID" ;;
            ai-service) application_id="$AI_APP_ID" ;;
            web) application_id="$WEB_APP_ID" ;;
            *) echo "Unknown service" >&2; exit 1 ;;
          esac

          if [[ -z "$application_id" ]]; then
            echo "Dokploy application id is not configured" \
              "for ${{ matrix.service.name }}" >&2
            exit 1
          fi

          echo "application_id=$application_id" >> "$GITHUB_OUTPUT"

      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          APPLICATION_ID: ${{ steps.dokploy.outputs.application_id }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST "$DOKPLOY_URL/api/application.deploy" \
            --header "accept: application/json" \
            --header "x-api-key: $DOKPLOY_API_KEY" \
            --header "Content-Type: application/json" \
            --data "{\"applicationId\":\"$APPLICATION_ID\"}"
