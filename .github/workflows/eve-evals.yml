---
name: Run Eve Evals

"on":
  workflow_dispatch:
    inputs:
      suite:
        description: Eval suite to run
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - safety
          - read-only

permissions:
  contents: read

jobs:
  eve-evals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck AI service
        run: pnpm --filter @oikentra/ai-service typecheck

      - name: Run smoke evals
        if: inputs.suite == 'smoke'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL_ID: ${{ vars.OPENAI_MODEL_ID }}
        run: pnpm --filter @oikentra/ai-service eval:smoke

      - name: Run safety evals
        if: inputs.suite == 'safety'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL_ID: ${{ vars.OPENAI_MODEL_ID }}
        run: pnpm --filter @oikentra/ai-service eval:safety

      - name: Run read-only evals
        if: inputs.suite == 'read-only'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL_ID: ${{ vars.OPENAI_MODEL_ID }}
          OIKENTRA_AGENT_BUSINESS_ID: ${{ vars.OIKENTRA_EVAL_BUSINESS_ID }}
          OIKENTRA_AGENT_USER_ID: ${{ vars.OIKENTRA_EVAL_USER_ID }}
          INTERNAL_AUTH_DEV_BYPASS: "true"
          INTERNAL_AUTH_DEV_USER_ID: ${{ vars.OIKENTRA_EVAL_USER_ID }}
          BUSINESS_BASE_URL: ${{ vars.OIKENTRA_EVAL_BUSINESS_BASE_URL }}
        run: pnpm --filter @oikentra/ai-service eval:read-only
