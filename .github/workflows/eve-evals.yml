---
name: Run Eve Evals

"on":
  workflow_dispatch:
    inputs:
      suite:
        description: Eval suite to run
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - safety
          - read-only

permissions:
  contents: read

concurrency:
  group: eve-evals-${{ inputs.suite }}
  cancel-in-progress: true

jobs:
  eve-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install AI service dependencies
        run: pnpm --filter @oikentra/ai-service... install --frozen-lockfile

      - name: Typecheck AI service
        run: pnpm --filter @oikentra/ai-service typecheck

      - name: Run selected eval suite
        env:
          EVAL_SCRIPT: eval:${{ inputs.suite }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL_ID: ${{ vars.OPENAI_MODEL_ID }}
          OIKENTRA_AGENT_BUSINESS_ID: ${{ vars.OIKENTRA_EVAL_BUSINESS_ID }}
          OIKENTRA_AGENT_USER_ID: ${{ vars.OIKENTRA_EVAL_USER_ID }}
          INTERNAL_AUTH_DEV_BYPASS: "true"
          INTERNAL_AUTH_DEV_USER_ID: ${{ vars.OIKENTRA_EVAL_USER_ID }}
          BUSINESS_BASE_URL: ${{ vars.OIKENTRA_EVAL_BUSINESS_BASE_URL }}
        run: pnpm --filter @oikentra/ai-service "$EVAL_SCRIPT"
